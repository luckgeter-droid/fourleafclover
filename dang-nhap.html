<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — FOUR-LEAF CLOVER</title>
<link rel="icon" href="assets/img/logo-four-leaf-clover.png" type="image/png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <a href="index.html" class="logo" style="color:#fff;">
      <svg viewBox="0 0 40 40" fill="none"><g><path class="petal p1" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)"/><path class="petal p2" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)" transform="rotate(90 20 20)"/><path class="petal p3" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)" transform="rotate(180 20 20)"/><path class="petal p4" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)" transform="rotate(270 20 20)"/></g><path class="spark-core" d="M20 15.2c.5 2.9 2.1 4.5 5 5-2.9.5-4.5 2.1-5 5-.5-2.9-2.1-4.5-5-5 2.9-.5 4.5-2.1 5-5Z" fill="#F0C24B"/><defs><linearGradient id="gClover" x1="7" y1="4" x2="33" y2="34"><stop stop-color="#1F5C3D"/><stop offset=".55" stop-color="#2E7D5B"/><stop offset="1" stop-color="#123626"/></linearGradient></defs></svg>
      <span class="word">FOUR-LEAF <b style="color:var(--orange);">CLOVER</b></span>
    </a>
    <blockquote>
      "Kỷ luật tạo nên sức mạnh — mỗi đề luyện hôm nay là một chiếc lá may mắn đưa bạn gần hơn tới cánh cổng đại học mơ ước."
      <cite>— Đội ngũ FOUR-LEAF CLOVER</cite>
    </blockquote>
    <div class="pulse-line-wrap" aria-hidden="true">
      <svg viewBox="0 0 1000 64" preserveAspectRatio="none">
        <defs><linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F5C3D"/><stop offset=".5" stop-color="#D4A017"/><stop offset="1" stop-color="#1B6F5C"/></linearGradient></defs>
        <path class="pulse-track" d="M0 32 H380 L410 8 L440 56 L470 32 H1000"/>
        <path class="pulse-anim" d="M0 32 H380 L410 8 L440 56 L470 32 H1000 M0 32 H380 L410 8 L440 56 L470 32 H1000"/>
      </svg>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 40 40" fill="none"><g><path class="petal p1" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)"/><path class="petal p2" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)" transform="rotate(90 20 20)"/><path class="petal p3" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)" transform="rotate(180 20 20)"/><path class="petal p4" d="M20 4C25.5 9.5 25.5 14.5 20 20 14.5 14.5 14.5 9.5 20 4Z" fill="url(#gClover)" transform="rotate(270 20 20)"/></g><path class="spark-core" d="M20 15.2c.5 2.9 2.1 4.5 5 5-2.9.5-4.5 2.1-5 5-.5-2.9-2.1-4.5-5-5 2.9-.5 4.5-2.1 5-5Z" fill="#F0C24B"/><defs><linearGradient id="gClover" x1="7" y1="4" x2="33" y2="34"><stop stop-color="#1F5C3D"/><stop offset=".55" stop-color="#2E7D5B"/><stop offset="1" stop-color="#123626"/></linearGradient></defs></svg>
        <span class="word">FOUR-LEAF <b>CLOVER</b></span>
      </a>
      <h2>Chào bạn quay lại</h2>
      <p class="sub">Đăng nhập để tiếp tục lộ trình luyện thi của bạn.</p>
      <div class="form-error" id="err" style="display:none;"></div>
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="ban@email.com" required>
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Nhập mật khẩu" required minlength="4">
            <button type="button" class="pw-toggle" id="pwToggle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
      </form>
      <p class="switch-line">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
  document.getElementById('pwToggle').addEventListener('click', () => {
    const i = document.getElementById('password');
    i.type = i.type === 'password' ? 'text' : 'password';
  });
  
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('err');
    
    errEl.style.display = 'none';
    errEl.textContent = '';
    
    if (!email.includes('@') || password.length < 4) {
      errEl.textContent = 'Vui lòng nhập email và mật khẩu hợp lệ (tối thiểu 4 ký tự)';
      errEl.style.display = 'block';
      return;
    }
    
    const result = await FLC.handleLogin(email, password);
    if (result.success) {
      FLC.showToast('Đăng nhập thành công! Chào mừng bạn quay lại.');
      setTimeout(() => window.location.href = 'index.html', 500);
    } else {
      errEl.textContent = result.error || 'Đăng nhập thất bại. Vui lòng thử lại.';
      errEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
